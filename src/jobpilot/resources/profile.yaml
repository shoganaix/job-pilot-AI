# Scaffold copy used by `jobpilot init` when config files are missing.
# Edit the real ones in config/ — this is only a regeneration template.
project:
  db_path: data/jobpilot.db
  snapshot_dir: data/snapshots
  master_cv: config/master_cv.yaml
  output_dir: output

search:
  target_offers: 300
  max_results_per_query: 50
  max_pages_per_query: 2
  locations:
    - { name: "Spain",   adzuna_country: "es" }
    - { name: "Germany", adzuna_country: "de" }
    - { name: "UK",      adzuna_country: "gb" }

families:
  - id: robotics
    label: "Robotics & Autonomous"
    queries: [ "Robotics Engineer", "Robotics Software Engineer", "Junior Robotics Engineer", "Autonomous Systems", "Rover" ]
    sources: [adzuna, arbeitnow, remoteok, himalayas]
    skills: { ros: 9, ros2: 9, python: 8, c++: 7, kinematics: 7, "motion planning": 7, slam: 7, perception: 7, gazebo: 6, simulation: 5, "control systems": 6, "real time": 5 }

  - id: embedded
    label: "Embedded & Firmware"
    queries: [ "Embedded Software Engineer", "Embedded Systems Engineer", "Firmware Engineer" ]
    sources: [adzuna, arbeitnow, remoteok, himalayas]
    skills: { c: 9, c++: 8, embedded: 9, microcontroller: 8, mcu: 7, arm: 7, stm32: 7, rtos: 7, "bare metal": 7, firmware: 8, i2c: 6, spi: 6, uart: 6, "can bus": 5, "linux kernel": 5 }

  - id: electronics
    label: "Electronics & Hardware"
    queries: [ "Electronics Engineer", "Electronics Test Engineer", "PCB Design Engineer", "Hardware Engineer" ]
    sources: [adzuna, arbeitnow, remoteok, himalayas]
    skills: { electronics: 8, pcb: 7, "altium designer": 6, kicad: 6, schematic: 6, hardware: 6, oscilloscope: 6, soldering: 5, labview: 5, "signal integrity": 5, "power electronics": 5 }

  - id: test_validation
    label: "Test, Validation & AIT/AIV"
    queries: [ "Test and Validation Engineer", "Test Engineer", "AIT Engineer", "AIV Engineer" ]
    sources: [adzuna, arbeitnow, remoteok, himalayas]
    skills: { testing: 8, validation: 7, "test automation": 7, pytest: 6, "ci/cd": 6, integration: 6, verification: 6, "requirement traceability": 5, "test plan": 5, jira: 4 }

  - id: systems_gnc
    label: "Systems, GNC, Avionics & Space"
    queries: [ "Systems Engineer", "GNC Engineer", "Guidance Navigation Control", "Avionics Engineer", "Space Systems Engineer", "Satellite Engineer" ]
    sources: [adzuna, arbeitnow, remoteok, himalayas]
    skills: { "systems engineering": 8, requirements: 7, mbse: 6, "do-178": 5, ecss: 5, avionics: 6, "attitude control": 6, orbit: 5, guidance: 6, navigation: 6, spacecraft: 6, "ground segment": 4 }

  - id: automation_controls
    label: "Automation & Controls"
    queries: [ "Automation Engineer", "Controls Engineer", "Robotics Automation" ]
    sources: [adzuna, arbeitnow, remoteok, himalayas]
    skills: { plc: 6, scada: 5, python: 7, controls: 6, pid: 5, "industrial automation": 6, fieldbus: 4, "isa-95": 4, instrumentation: 5 }

  - id: software_perception
    label: "Software, Python & Computer Vision"
    queries: [ "Python Developer", "Computer Vision Engineer", "Software Engineer" ]
    sources: [adzuna, arbeitnow, remoteok, himalayas]
    skills: { python: 9, "computer vision": 8, "deep learning": 7, opencv: 7, pytorch: 6, numpy: 6, "clean code": 5, "ci/cd": 5, git: 5 }

scoring:
  threshold: 65
  review_threshold: 45
  weights: { skills: 30, experience: 20, education: 10, location: 15, seniority: 15, interest: 10 }

profile:
  seniority_target: junior
  languages: [es, en]
  locations:
    - { area: "Madrid (Spain)", kind: onsite, weight: 100 }
    - { area: "Spain", kind: onsite, weight: 85 }
    - { area: "Remote EU", kind: remote, weight: 90 }
    - { area: "Remote global", kind: remote, weight: 60 }
  exclude_companies: []

ats_companies:
  greenhouse: []
  lever: []